{% extends "base.html" %}

{# {{ handle }} is escaped automatically: a handle containing <script> renders
   as visible text, not as a running script. That protection comes from using
   render_template instead of building HTML with f-strings. #}
{% block title %}{{ handle }} &mdash; NextCF{% endblock %}

{% block content %}
  {# The quiet surface. Same tokens as the landing page, turned down: the
     heading is the head size rather than the display size, rows are tight,
     and the accent colour appears only on a verdict that says OK -- which is
     the one thing somebody scanning this table is looking for. #}
  <div class="tool">
    <h1>{{ handle }}</h1>

    {# <time> is the element for a machine-readable instant, and it is what
       keeps the timestamp from being broken across two lines -- ISO-8601
       has no spaces, so a browser breaks it at the hyphens instead. #}
    <p class="meta">
      {{ total }} submissions, last synced
      <time datetime="{{ last_synced }}">{{ last_synced }}</time>.
    </p>

    {# Recommendations first: this is the product, and everything below it is
       evidence for it.

       recs.state is decided in web.py's recommendation_view, and each state
       gets its own sentence, because "no recommendations" means four
       different things and the visitor deserves to know which. #}
    <section class="recs">
      <h2>Next</h2>

      {% if recs.state == "ok" %}
        {# The sentence that says exactly what the number is. A bare "71%"
           invites the reader to supply their own meaning, and the two
           meanings on offer differ by a thousand rating points -- see the ADR
           on the baseline. #}
        {# "around 2800" is the PROBLEM rating. The first version said "at your
           rating -- around 2800", which reads as if 2800 were the visitor's
           own rating, so the problem rating now comes first and "your rating"
           only ever means theirs. #}
        {% if recs.source == "topic" %}
          {# The topic model's claim is about THIS person, and the sentence
             says what it was worked out from -- the three things the
             evaluation found carry the information (ADR 0014). #}
          <p class="meta">
            Chosen for you: the chance your first submission is accepted, worked
            out from your own history, how 4,000 other users actually did on
            each problem, and how hard its topics are. Aiming at
            {{ recs.target }}%.
            <a href="{{ url_for('how') }}">How this works</a>
          </p>
          {# Said plainly rather than hidden: the model learned from users
             rated roughly 350 to 2,370 at the time of their attempts, and
             beyond that its numbers are a guess with the same confidence
             as its measurements -- unless the page says otherwise. #}
          {% if recs.extrapolated %}
            <p class="footnote">
              Your rating is outside the range the model learned from, so these
              chances are an extrapolation and less reliable than they look.
            </p>
          {% endif %}
          {# Codeforces shows a new account less than it computes with, for
             six rated contests. The chances use the computed number, and
             without this line a visitor who sees 700 on their profile gets
             problems picked for 1250 and no reason why. #}
          {# Nobody has a rating before their first rated contest. The model
             still needs one, so it starts them at the value that predicted
             such attempts best, and their own practice moves them -- ADR
             0016. Said, because the number is a choice and not theirs. #}
          {% if recs.unrated %}
            <p class="footnote">
              You have no rating yet, so these chances start from
              {{ recs.computed }} &mdash; the starting point that predicted best
              for people who had not yet entered a rated contest &mdash; and
              move with how your own practice has gone.
            </p>
          {% endif %}
          {% if recs.hidden %}
            <p class="footnote">
              Codeforces shows you {{ recs.shown }} but computes with
              {{ recs.computed }}: for a new account's first six rated contests
              it holds part of the rating back and returns it contest by
              contest. These chances use {{ recs.computed }}.
            </p>
          {% endif %}
        {% else %}
          <p class="meta">
            Problems rated around {{ recs.centre }}, where
            {% if recs.event == "first_try" %}
              a first submission from somebody at your rating is accepted about
              {{ recs.target }}% of the time.
            {%- else %}
              somebody at your rating solves them in the end about
              {{ recs.target }}% of the time.
            {%- endif %}
            Rating only, so everybody at your rating is shown these five.
          </p>
        {% endif %}

        <table class="rec-table">
          <thead>
            <tr>
              <th>Problem</th>
              <th class="num">Rating</th>
              <th class="num">Chance</th>
            </tr>
          </thead>
          <tbody>
            {% for problem in recs.problems %}
              <tr>
                <td><a href="{{ problem.url }}">{{ problem.name }}</a></td>
                <td class="num rating">{{ problem.rating }}</td>
                {# The accent's defined meaning is "this is good, or this is
                   where you act" -- ADR 0006. These five rows are the only
                   place on the page where somebody is being asked to act. #}
                <td class="num chance">{{ problem.percent }}%</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>

      {% elif recs.state == "unrated" %}
        <p class="meta">
          Codeforces has no rating for {{ handle }} yet, and the rating-only
          recommender in use right now needs one, so there is nothing to base
          a recommendation on until one exists.
        </p>

      {% elif recs.state == "not_ready" %}
        <p class="meta">
          The problem list is still loading. Reload in a few seconds.
        </p>

      {% else %}
        <p class="meta">
          You have solved every rated problem on Codeforces. There is nothing
          left to recommend.
        </p>
      {% endif %}
    </section>

    {# The topic breakdown, above the submissions table because it is the more
       useful of the two: the table is a log, this is a shape.

       Drawn as a table with a CSS bar in one cell rather than as an SVG
       chart -- see ADR 0001's amendment of 2026-09-15. A screen reader reads
       this as rows of numbers, it reflows on a phone without a viewBox, and
       it is the markup ADR 0008 describes a React component taking over.

       No accent colour anywhere in here. Thirty-five bright green bars would
       make the accent decoration, and ADR 0006 spends it on one meaning:
       "this is good, or this is where you act". The recommendations at v0.4
       are where it is going. #}
    {% if topics %}
      <section class="topics">
        <h2>Topics</h2>

        {# The honest framing, and it is short on purpose. This page is read in
           a hurry, and the claim it must not make -- that these numbers say
           how good somebody is -- takes one sentence to refuse. #}
        <p class="meta">
          What you have practised. Not yet how good you are at it.
        </p>

        <table>
          <thead>
            <tr>
              <th>Topic</th>
              <th class="num">Solved</th>
              <th class="num">Avg rating</th>
            </tr>
          </thead>
          <tbody>
            {# The bar is the row's own background, not a column. A column of
               bars cannot survive a phone: at 375px the label and the two
               number columns already want every pixel, so the flexible bar
               column collapsed to two pixels and the chart disappeared. A
               background cannot be squeezed by its neighbours, so this is the
               same chart at every width instead of two layouts to keep in
               step.

               --bar is read by the gradient in style.css. A custom property
               is the one thing that belongs in a style attribute: it is a
               value, not a rule, and the rule using it stays in the
               stylesheet where the token system lives. #}
            {% for topic in topics %}
              <tr style="--bar: {{ topic.width }}%">
                <th scope="row" class="topic-name">{{ topic.tag }}</th>

                <td class="num">
                  {{ topic.solved }}<span class="of">/{{ topic.attempted }}</span>
                </td>

                <td class="num">
                  {% if topic.mean is not none %}
                    {{ topic.mean }}
                    {# Only shown when the average rests on fewer problems than
                       the user solved, which happens because about a third of
                       the problemset has no rating. A mean over two problems
                       and a mean over three hundred must not look alike. #}
                    {% if topic.rated_solved != topic.solved %}
                      <span class="of">({{ topic.rated_solved }} rated)</span>
                    {% endif %}
                  {% else %}
                    &mdash;
                  {% endif %}
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>

        {# The two things about these numbers that look like mistakes and are
           not. Somebody will add the column up; it should agree with them
           before they have to ask. #}
        <p class="footnote">
          A problem carries about three tags and counts under each, so the
          Solved column adds to more than the {{ totals.solved }} problems
          solved
          {%- if totals.solved_untagged %}, and {{ totals.solved_untagged }}
          solved
          {{- ' problem has' if totals.solved_untagged == 1 else ' problems have' }}
          no tags at all and appear in no row
          {%- endif -%}
          . Average rating covers the rated problems solved in each topic; topics
          differ in how hard their problems are for everybody, so the averages
          are not yet comparable between rows.
        </p>
      </section>
    {% endif %}

    {# A real account with zero submissions is a valid answer, not an error, and
       an empty table with no explanation looks like a bug. #}
    {% if not rows %}
      <p>No submissions found for this handle.</p>
    {% else %}
      <h2>Submissions</h2>

      {# The database holds the whole history, and this table shows the newest
         slice of it. Saying so is the point: a list quietly cut short reads as
         "that is all there is". #}
      {% if total > rows | length %}
        <p class="meta">The {{ rows | length }} most recent of {{ total }}.</p>
      {% endif %}

      {# The wrapper is what scrolls on a narrow screen, so a wide table never
         pushes the whole page sideways. #}
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rating</th>
              <th>Verdict</th>
              <th>Problem</th>
            </tr>
          </thead>
          <tbody>
            {# for/endfor is Jinja's loop. `row` is one dict from display_row(). #}
            {% for row in rows %}
              <tr>
                {# Explicitly comparing to none, not `if row.rating`, because 0 is
                   falsy and would print as a dash too. No Codeforces problem is
                   rated 0 today, but a truth test that happens to work is a bug
                   waiting for the day the data changes. #}
                <td class="rating">{% if row.rating is not none %}{{ row.rating }}{% else %}&mdash;{% endif %}</td>

                {# row.ok is decided in display_row, not here. What counts as a
                   solve is program logic; which class carries the accent colour
                   is presentation. #}
                <td class="verdict {% if row.ok %}verdict-ok{% endif %}">{{ row.verdict }}</td>

                <td>
                  {% if row.url %}
                    <a href="{{ row.url }}">{{ row.name }}</a>
                  {% else %}
                    {{ row.name }}
                  {% endif %}
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% endif %}

    <p class="meta"><a href="{{ url_for('index') }}">Try another handle</a></p>
  </div>
{% endblock %}
